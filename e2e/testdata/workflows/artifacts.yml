name: artifacts
on: push
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - run: echo "artifact content" > payload.txt
      - uses: actions/upload-artifact@v4
        with:
          name: payload
          path: payload.txt
  download:
    needs: upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: payload
      - run: cat payload.txt
