name: outputs
on: push
jobs:
  produce:
    runs-on: ubuntu-latest
    outputs:
      token: ${{ steps.emit.outputs.token }}
    steps:
      - id: emit
        run: echo "token=produced-value-42" >> "$GITHUB_OUTPUT"
  consume:
    needs: produce
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "received=${{ needs.produce.outputs.token }}"
          test "${{ needs.produce.outputs.token }}" = "produced-value-42"
