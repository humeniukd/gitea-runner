name: services
on: push
jobs:
  reach:
    runs-on: ubuntu-latest
    services:
      web:
        image: nginx:alpine
        ports:
          - 80
    steps:
      - run: |
          for i in $(seq 1 30); do
            if getent hosts web >/dev/null 2>&1; then break; fi
            sleep 1
          done
          apt-get update -qq && apt-get install -y -qq curl >/dev/null 2>&1 || true
          curl -sSf http://web/ | grep -qi nginx
          echo "service-reachable-ok"
