{{- if and .Values.runner.registration.create .Values.runner.registration.token -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.runner.registration.secretName }}
  namespace: {{ include "gitea-runner.namespace" . }}
  labels:
    {{- include "gitea-runner.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
type: Opaque
stringData:
  {{ .Values.runner.registration.secretKey }}: {{ .Values.runner.registration.token | quote }}
{{- end -}}
