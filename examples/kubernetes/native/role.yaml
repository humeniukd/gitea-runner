#
# Least-privilege Role scoped to gitea-e2e:
#   pods        – create/get/list/watch/delete  (job pod lifecycle)
#   pods/exec   – create                         (remotecommand step execution)
#   pods/log    – get                            (log streaming)
#   secrets     – create/get/delete              (per-job credential Secrets)
#   configmaps  – create/get/delete              (per-job ConfigMaps)
#
# pods/attach is intentionally absent: the k8s backend uses pods/exec
# (remotecommand) exclusively for step execution. There is no consumer for
# the pods/attach subresource (plan D8/M1).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitea-runner
  namespace: gitea-e2e
  labels:
    app.kubernetes.io/name: gitea-runner
    app.kubernetes.io/component: runner
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["create", "get", "list", "watch", "delete"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["secrets", "configmaps"]
  verbs: ["create", "get", "delete"]
