#
# Runner configuration for the Kubernetes-native pod backend.
#
# The kubernetes.* field names must match the Kubernetes config struct defined
# in internal/pkg/config/config.go (Phase 1, task #2). These are drafted from
# plan §Phase 1; reconcile against the actual struct yaml tags once task #2
# lands.
#
# cache.host MUST be a cluster-routable DNS name — never 127.0.0.1 or
# localhost. The Phase 6 startup guard rejects loopback values when
# kubernetes.enabled is true.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-runner-config
  namespace: gitea-e2e
  labels:
    app.kubernetes.io/name: gitea-runner
    app.kubernetes.io/component: runner
data:
  config.yaml: |
    log:
      level: info

    runner:
      # .runner lives on the PVC so registration survives pod restarts.
      file: /data/.runner
      # capacity bounds concurrent jobs for the docker/host backends only.
      # In kubernetes mode it is BYPASSED — see kubernetes.max_concurrent_jobs
      # (0 = unlimited) below; the kube-scheduler + a namespace ResourceQuota
      # are the real backpressure.
      capacity: 4
      timeout: 3h

    cache:
      enabled: true
      dir: /tmp/actcache
      # Cluster-routable hostname for the gitea-runner-cache Service.
      # Must match the Service name + namespace in service.yaml.
      host: gitea-runner-cache.gitea-e2e.svc.cluster.local
      port: 3000

    kubernetes:
      enabled: true
      namespace: gitea-e2e
      service_account: gitea-runner

      # Image for bare `run:` jobs that declare no `container: image:` (a
      # runs-on label that maps to no image). Defaults to node:20-bookworm.
      default_job_image: node:20-bookworm

      # URL job pods use to reach the embedded cache server.
      # Must be cluster-routable (Phase 6 startup guard enforces this).
      connect_back_address: "http://gitea-runner-cache.gitea-e2e.svc.cluster.local:3000"

      # How long to wait for a job pod to reach Ready before timing out.
      pod_ready_timeout: 10m

      # When to delete a completed job pod (and its per-job Secret/ConfigMap):
      #   always     - delete after every job (default).
      #   on-failure - delete only when the job SUCCEEDED; KEEP failed pods so
      #                you can `kubectl exec` into the (still-sleeping) job
      #                container and inspect the workspace for debugging.
      #   never      - KEEP every pod for full audit retention.
      # Retained pods are marked actions.gitea.com/retain=true so a runner
      # restart's dangling-owner sweep will NOT reap them. NOTE: a retained pod
      # keeps running its sleep entrypoint and so consumes cluster CPU/memory
      # AND a runner capacity slot until you delete it manually
      # (kubectl delete pod <name>); prune retained pods regularly.
      pod_cleanup: always

      # Max job pods this runner runs concurrently. 0 (default) = UNLIMITED:
      # the runner accepts every assigned job and creates a pod for it, letting
      # the kube-scheduler pend the backlog instead of queuing it inside the
      # runner. This makes the small host-process `runner.capacity` irrelevant
      # in k8s mode (it still bounds docker/host runners). A positive value is
      # an OPTIONAL client-side cap on in-flight job pods.
      #
      # The REAL admission control should be the cluster, not the runner: set a
      # ResourceQuota (and/or LimitRange) on this namespace to bound total pods
      # / CPU / memory — see the README. Cost of unlimited: one runner goroutine
      # + one API watch per in-flight job, so very large fan-outs add API-server
      # load; cap with a ResourceQuota rather than a tiny runner limit.
      max_concurrent_jobs: 0

      # Sandboxed container runtimes via Kubernetes RuntimeClass. The named
      # RuntimeClass objects must already exist in the cluster (see
      # runtimeclass.yaml for gVisor/Kata examples) and the node must run the
      # matching runtime handler (runsc for gVisor, kata for Kata). Leave both
      # unset to use the node default runtime (runc).
      #
      # runtime_class_name applies one RuntimeClass to EVERY job pod:
      #   runtime_class_name: gvisor
      #
      # runtime_class_by_label maps a runs-on label to a RuntimeClass so a
      # single runner can mix isolation levels per workflow. The first matching
      # runs-on label wins; jobs matching no entry fall back to
      # runtime_class_name (and then to the cluster default if that is empty).
      # With the mapping below, `runs-on: k8s-gvisor` runs under gVisor and
      # `runs-on: k8s-kata` under Kata, while a plain `runs-on: k8s-native`
      # uses the node default runtime.
      #
      # runtime_class_by_label:
      #   k8s-gvisor: gvisor
      #   k8s-kata: kata

      workspace_volume:
        type: emptyDir

      # Per-container-role resource defaults (M3). Each role is independently
      # overridable. dind requests >=1Gi memory (plan M3 constraint).
      resources:
        job:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: "2"
            memory: 2Gi
        service:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 1Gi
        dind:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 4Gi

      dind:
        # Set enabled: true to support uses: docker:// steps (Phase 8).
        # No auto-detect: must be explicitly opted in (plan ruling).
        enabled: false
        # rootless: true uses docker:dind-rootless (default, lower privilege).
        # Set false for a privileged sidecar when rootless dind cannot build
        # certain images.
        rootless: true
        image: docker:28-dind-rootless
