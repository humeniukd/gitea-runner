#
# ClusterIP Service that exposes the runner's embedded artifact-cache server
# to job pods at a stable cluster-DNS address:
#   http://gitea-runner-cache.gitea-e2e.svc.cluster.local:3000
#
# This address is set as kubernetes.connect_back_address in the ConfigMap so
# ACTIONS_CACHE_URL advertised to job pods is always cluster-routable (never
# 127.0.0.1). The Phase 6 startup guard enforces this invariant at runtime.
#
# NOTE: With replicas=1 this Service deterministically reaches the single
# runner pod's embedded cache. For replicas>1, each runner has its own
# in-process cache; a per-pod headless Service would be required — deferred.
apiVersion: v1
kind: Service
metadata:
  name: gitea-runner-cache
  namespace: gitea-e2e
  labels:
    app.kubernetes.io/name: gitea-runner
    app.kubernetes.io/component: cache
spec:
  selector:
    app.kubernetes.io/name: gitea-runner
    app.kubernetes.io/component: runner
  ports:
  - name: cache
    port: 3000
    targetPort: cache
    protocol: TCP
  type: ClusterIP
