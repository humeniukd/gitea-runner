# Bind the gitea-runner Role to the gitea-runner ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-runner
  namespace: gitea-e2e
  labels:
    app.kubernetes.io/name: gitea-runner
    app.kubernetes.io/component: runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitea-runner
subjects:
- kind: ServiceAccount
  name: gitea-runner
  namespace: gitea-e2e
