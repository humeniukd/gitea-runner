#
# Gitea Actions runner Deployment using the Kubernetes-native pod backend.
#
# Pre-requisite: create a Secret containing the runner registration token:
#   kubectl -n gitea-e2e create secret generic gitea-runner-token \
#     --from-literal=token=<registration-token>
#
# The registration token is obtained from Gitea (Site Admin → Runners → Add
# Runner) or minted by the E2E Deno harness (tests/e2e/k8s/run.ts).
#
# Key environment variables:
#   POD_NAME / POD_UID  – downward-API fields injected so the k8s backend can
#                         set an ownerReference on job pods pointing at this
#                         runner's own Pod (RC2: self-cleaning orphan GC).
#   CONFIG_FILE         – tells run.sh to pass --config to gitea-runner.
#   GITEA_INSTANCE_URL  – Gitea server URL the runner registers against.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-runner
  namespace: gitea-e2e
  labels:
    app.kubernetes.io/name: gitea-runner
    app.kubernetes.io/component: runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea-runner
      app.kubernetes.io/component: runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea-runner
        app.kubernetes.io/component: runner
    spec:
      serviceAccountName: gitea-runner
      volumes:
      # PVC: persists .runner state so restarts reuse the existing registration.
      - name: runner-data
        persistentVolumeClaim:
          claimName: gitea-runner-data
      # ConfigMap: runner config including the kubernetes backend settings.
      - name: runner-config
        configMap:
          name: gitea-runner-config
      # emptyDir: ephemeral storage for the embedded artifact-cache server.
      - name: cache-data
        emptyDir: {}
      containers:
      - name: runner
        # Pin to a specific release tag in production.
        # The basic variant (alpine + tini, no docker daemon) is sufficient
        # for the native k8s backend — docker is not needed in the runner pod.
        image: gitea/runner:nightly
        env:
        # Downward API: runner Pod name and UID for job-pod ownerReference.
        # The k8s backend reads these to set ownerReference.uid = POD_UID so
        # Kubernetes GC reaps job pods when this runner pod is deleted (RC2).
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        # Tell run.sh to pass --config /etc/act_runner/config.yaml to
        # gitea-runner, enabling the full kubernetes backend config.
        - name: CONFIG_FILE
          value: /etc/act_runner/config.yaml
        # Gitea instance URL. The runner registers here on first start when
        # /data/.runner does not yet exist.
        - name: GITEA_INSTANCE_URL
          value: http://gitea.192.168.2.190.nip.io
        # Registration token read from Secret. Unset after registration by
        # run.sh to prevent leaking it into the gitea-runner process.
        - name: GITEA_RUNNER_REGISTRATION_TOKEN
          valueFrom:
            secretKeyRef:
              name: gitea-runner-token
              key: token
        ports:
        # cache: the embedded artifact-cache server; exposed via Service
        # gitea-runner-cache so job pods can reach ACTIONS_CACHE_URL.
        - name: cache
          containerPort: 3000
          protocol: TCP
        volumeMounts:
        - name: runner-data
          mountPath: /data
        - name: runner-config
          mountPath: /etc/act_runner
          readOnly: true
        - name: cache-data
          mountPath: /tmp/actcache
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
