#
# PersistentVolumeClaim for runner state (.runner registration file).
# Mounting at /data means the runner reuses its registration across pod
# restarts rather than re-registering on every startup (Phase 7, AC #8).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-runner-data
  namespace: gitea-e2e
  labels:
    app.kubernetes.io/name: gitea-runner
    app.kubernetes.io/component: runner
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
