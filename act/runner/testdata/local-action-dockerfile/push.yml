name: local-action-dockerfile
on: push
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: ./actions/docker-local
      id: dockerlocal
      with:
        who-to-greet: 'Mona the Octocat'
    - run: '[[ "${{ env.SOMEVAR }}" == "Mona the Octocat" ]]'
    - run: '[ "${SOMEVAR}" = "Not Mona" ] || exit 1'
      env:
        SOMEVAR: 'Not Mona'
    - run: '[[ "${{ steps.dockerlocal.outputs.whoami }}" == "Mona the Octocat" ]]'
    - run: |
        printf '\necho "whoami=rebuilt-$WHOAMI-$DOCKERFILE_VERSION" >> "$GITHUB_OUTPUT"\n' >> actions/docker-local/entrypoint.sh
        printf '\nENV DOCKERFILE_VERSION=updated\n' >> actions/docker-local/Dockerfile
    - uses: ./actions/docker-local
      id: rebuilt
      with:
        who-to-greet: 'Mona the Octocat'
    - run: '[[ "${{ steps.rebuilt.outputs.whoami }}" == "rebuilt-Mona the Octocat-updated" ]]'
    # Test if overriding args doesn't leak inputs
    - uses: ./actions/docker-local-noargs
      with:
        args: ${{format('"{0}"', 'Mona is not the Octocat') }}
        who-to-greet: 'Mona the Octocat'
    - run: '[[ "${{ env.SOMEVAR }}" == "Mona is not the Octocat" ]]'
