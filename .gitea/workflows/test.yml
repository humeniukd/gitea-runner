name: checks
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    name: check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: lint
        run: make lint
      - name: build
        run: make build
      - name: test
        run: make test

  dind:
    name: dind daemon integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      # Builds the dind image and runs the daemon-facing tests against the docker version
      # it ships, catching daemon-level regressions (e.g. gitea/runner#981) before release.
      - name: test against dind image
        run: make test-dind