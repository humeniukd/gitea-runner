version: "2"
output:
  sort-order:
    - file
linters:
  default: none
  enable:
    - bidichk
    - bodyclose
    - depguard
    - dupl
    - errcheck
    - forbidigo
    - gocheckcompilerdirectives
    - gocritic
    - govet
    - ineffassign
    - mirror
    - modernize
    - nakedret
    - nilnil
    - nolintlint
    - perfsprint
    - revive
    - staticcheck
    - testifylint
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/pkg/errors
              desc: Please use "errors" package from standard library
            - pkg: gotest.tools/v3
              desc: Please keep tests unified using only github.com/stretchr/testify
            - pkg: log
              desc: Please keep logging unified using only github.com/sirupsen/logrus
    gocritic:
      disabled-checks:
        - ifElseChain
    gocyclo:
      min-complexity: 20
    importas:
      alias:
        - pkg: github.com/sirupsen/logrus
          alias: log
        - pkg: github.com/stretchr/testify/assert
          alias: assert
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - report
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - goimports
  exclusions:
    generated: lax
    paths:
      - report
      - third_party$
      - builtin$
      - examples$
