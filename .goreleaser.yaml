version: 2

project_name: gitea-runner

before:
  hooks:
    - go mod tidy

builds:
- env:
  - CGO_ENABLED=0
  goos:
  - darwin
  - linux
  - windows
  - freebsd
  goarch:
  - amd64
  - arm
  - arm64
  - loong64
  - s390x
  - riscv64
  goarm:
  - "5"
  - "6"
  - "7"
  ignore:
    - goos: darwin
      goarch: arm
    - goos: darwin
      goarch: ppc64le
    - goos: darwin
      goarch: s390x
    - goos: windows
      goarch: ppc64le
    - goos: windows
      goarch: s390x
    - goos: windows
      goarch: arm
      goarm: "5"
    - goos: windows
      goarch: arm
      goarm: "6"
    - goos: windows
      goarch: arm
      goarm: "7"
    - goos: windows
      goarch: arm64
    - goos: freebsd
      goarch: ppc64le
    - goos: freebsd
      goarch: s390x
    - goos: freebsd
      goarch: arm
      goarm: "5"
    - goos: freebsd
      goarch: arm
      goarm: "6"
    - goos: freebsd
      goarch: arm
      goarm: "7"
    - goos: freebsd
      goarch: arm64
  flags:
  - -trimpath
  ldflags:
  - -s -w -X gitea.com/gitea/runner/internal/pkg/ver.version={{ .Summary }}
  binary: >-
    {{ .ProjectName }}-
    {{- .Version }}-
    {{- .Os }}-
    {{- if eq .Arch "amd64" }}amd64
    {{- else if eq .Arch "amd64_v1" }}amd64
    {{- else if eq .Arch "386" }}386
    {{- else }}{{ .Arch }}{{ end }}
    {{- if .Arm }}-{{ .Arm }}{{ end }}
  no_unique_dist_dir: true
  hooks:
    post:
      - cmd: xz -k -9 {{ .Path }}
        dir: ./dist/
      - cmd: sh .goreleaser.checksum.sh {{ .Path }}
      - cmd: sh .goreleaser.checksum.sh {{ .Path }}.xz

blobs:
  -
    provider: s3
    bucket: "{{ .Env.S3_BUCKET }}"
    region: "{{ .Env.S3_REGION }}"
    directory: "gitea-runner/{{.Version}}"
    extra_files:
      - glob: ./**.xz
      - glob: ./**.sha256

# Mirrors the S3 upload above into Cloudflare R2, during the parallel
# S3+R2 upload period (AWS S3 will be removed once the migration to R2
# is complete). A second `blobs:` entry cannot be used here because
# the blobs pipe authenticates from the global AWS_* environment and
# has no per-entry credential fields, so two different credential
# sets (S3 vs R2) cannot coexist in `blobs:`. `publishers:` supports
# per-entry `env:`, so it is used instead, invoking scripts/upload-r2.sh
# once per artifact. Custom publishers only inherit
# HOME/USER/USERPROFILE/TMPDIR/TMP/TEMP/PATH from the environment, so
# the R2 credentials must be forwarded explicitly below.
publishers:
  - name: cloudflare-r2
    checksum: true
    extra_files:
      - glob: ./**.xz
      - glob: ./**.sha256
    cmd: sh scripts/upload-r2.sh {{ abs .ArtifactPath }} gitea-runner/{{ .Version }}/{{ .ArtifactName }}
    env:
      - R2_ENDPOINT={{ index .Env "R2_ENDPOINT" }}
      - R2_BUCKET={{ index .Env "R2_BUCKET" }}
      - R2_ACCESS_KEY_ID={{ index .Env "R2_ACCESS_KEY_ID" }}
      - R2_SECRET_ACCESS_KEY={{ index .Env "R2_SECRET_ACCESS_KEY" }}

archives:
  - format: binary
    name_template: "{{ .Binary }}"
    allow_different_binary_count: true

checksum:
  name_template: 'checksums.txt'
  extra_files:
      - glob: ./**.xz

snapshot:
  version_template: "{{ .Branch }}-devel"

nightly:
  version_template: "nightly"

gitea_urls:
  api: https://gitea.com/api/v1
  download: https://gitea.com

release:
  extra_files:
    - glob: ./**.xz
    - glob: ./**.xz.sha256

